[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sanzaru"
version = "0.2.0"
description = "A cooperation benchmark for LLM agents under asymmetric perception"
requires-python = ">=3.10"
license = {file = "LICENSE"}

[project.optional-dependencies]
local = ["vllm>=0.5"]
test = ["pytest>=8"]

[project.scripts]
sanzaru = "sanzaru.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["sanzaru*"]

[tool.setuptools.package-data]
sanzaru = ["prompts/*.md"]
